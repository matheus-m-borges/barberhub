<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1c1f26"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea79"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Luxury Rounded Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Scissor & Barber Emblem with Glow -->
  <g filter="url(#glow)">
    <!-- Right Blade -->
    <path d="M 170,110 C 170,110 240,240 256,260 C 275,285 305,320 310,340 C 316,365 306,395 285,410 C 260,428 225,420 210,395 C 198,375 204,350 216,335 C 230,318 245,300 245,300 L 160,135 Z" fill="url(#goldGrad)"/>
    <circle cx="255" cy="385" r="24" fill="#0a0c10"/>

    <!-- Left Blade -->
    <path d="M 342,110 C 342,110 272,240 256,260 C 237,285 207,320 202,340 C 196,365 206,395 227,410 C 252,428 287,420 302,395 C 314,375 308,350 296,335 C 282,318 267,300 267,300 L 352,135 Z" fill="url(#bladeGrad)"/>
    <circle cx="257" cy="385" r="24" fill="#0a0c10"/>

    <!-- Center Pivot Screw -->
    <circle cx="256" cy="260" r="22" fill="#0a0c10" stroke="url(#goldGrad)" stroke-width="8"/>
    <circle cx="256" cy="260" r="8" fill="url(#goldGrad)"/>
  </g>

  <!-- Barber Pole Stripes Accent -->
  <path d="M 120,440 L 140,460" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  <path d="M 140,440 L 160,460" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <path d="M 160,440 L 180,460" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>

  <!-- Brand Typography -->
  <text x="256" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="6" fill="url(#goldGrad)" text-anchor="middle">BARBERHUB</text>
</svg>
